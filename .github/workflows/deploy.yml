name: Deploy to OMV

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # Вместо ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy to local folder
      run: |
        # Теперь вы работаете прямо на OMV!
        TARGET_PATH="/srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi"
        
        # Создаем папку если нет
        mkdir -p $TARGET_PATH
        
        # Копируем файлы (локально!)
        cp -r * $TARGET_PATH/
        
        # Переходим и перезапускаем API
        cd $TARGET_PATH
        docker compose build webapi
        docker compose up -d webapi
        docker image prune -f