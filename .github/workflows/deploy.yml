name: Deploy to OMV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Show current directory
      run: |
        echo "📁 Current directory: $(pwd)"
        echo "📂 Files in current directory:"
        ls -la
        
    - name: Create target directory
      run: |
        TARGET="/srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi"
        echo "🎯 Target directory: $TARGET"
        
        # Создаем папку если её нет
        mkdir -p "$TARGET"
        echo "✅ Target directory ready"
        
    - name: Copy files to target
      run: |
        TARGET="/srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi"
        
        echo "📋 Copying files to $TARGET"
        
        # Копируем все файлы (включая скрытые) в целевую папку
        cp -rf . "$TARGET/"
        
        echo "✅ Files copied successfully"
        
    - name: Verify copied files
      run: |
        TARGET="/srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi"
        
        echo "📂 Files in target directory:"
        ls -la "$TARGET"
        
        echo "📁 WebAPI directory:"
        ls -la "$TARGET/WebAPI" || echo "WebAPI directory not found"
        
    - name: Build and restart API
      run: |
        cd /srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi
        
        echo "🔨 Building API..."
        docker compose build webapi
        
        echo "🚀 Restarting API..."
        docker compose up -d webapi
        
        echo "🧹 Cleaning up..."
        docker image prune -f
        
        echo "✅ Deployment complete!"
        docker compose ps