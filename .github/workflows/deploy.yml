name: Deploy to OMV

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy to OMV
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.OMV_HOST }}
        username: ${{ secrets.OMV_USER }}
        password: ${{ secrets.OMV_PASSWORD }}
        script: |
          PROJECT_PATH="/srv/dev-disk-by-uuid-310ff77b-00b4-4054-80af-1595c90f666a/Data/webapi"
          
          # Создаем папку если нет
          mkdir -p $PROJECT_PATH
          cd $PROJECT_PATH
          
          # Клонируем или обновляем
          if [ ! -d ".git" ]; then
            git clone https://github.com/${{ github.repository }}.git .
          else
            git pull origin main
          fi
          
          # Пересобираем и запускаем API
          docker compose build webapi
          docker compose up -d webapi
          
          # Очистка
          docker image prune -f